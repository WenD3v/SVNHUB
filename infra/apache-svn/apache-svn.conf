<VirtualHost *:80>
    ServerName localhost

    <Location /svn>
        DAV svn
        SVNParentPath /var/svn/repos
        SVNListParentPath on
        AuthzSVNAccessFile /etc/apache2/svn-authz
        AuthType Basic
        AuthName "SVNHUB SVN"
        AuthUserFile /etc/apache2/dav_svn.passwd
        Require valid-user
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/svnhub-error.log
    CustomLog ${APACHE_LOG_DIR}/svnhub-access.log combined
</VirtualHost>
